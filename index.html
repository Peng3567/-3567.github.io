<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#111;color:#fff;}

/* 竖屏：只显示旋转提示 */
@media screen and (orientation:portrait){
  #album{display:none;}
  .rotate-tip{display:block;}
}
/* 横屏：显示相册 */
@media screen and (orientation:landscape){
  #album{display:block;}
  .rotate-tip{display:none;}
}

.rotate-tip{
  display:none;
  text-align:center;
  font-size:24px;
  padding-top:40vh;
}

#album{
  padding:20px;
}
.photo-grid{
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(220px,1fr));
  gap:16px;
}
.photo-grid img{
  width:100%;
  height:160px;
  object-fit:cover;
  border-radius:8px;
  cursor:pointer;
  transition:0.2s;
}
.photo-grid img:hover{
  transform:scale(1.03);
}

/* 图片放大弹窗 */
#lightbox{
  position:fixed;
  top:0;left:0;
  width:100vw;height:100vh;
  background:rgba(0,0,0,0.95);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}
#lightbox.active{
  display:flex;
}
#lightbox img{
  max-width:90vw;
  max-height:90vh;
}
/* 左右翻页按钮 */
.prev, .next{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  font-size:40px;
  color:#fff;
  background:rgba(255,255,255,0.15);
  border:none;
  width:50px;height:80px;
  cursor:pointer;
}
.prev{left:20px;}
.next{right:20px;}
</style>
</head>

<!-- 放大弹窗+翻页按钮 -->
<div id="lightbox" onclick="closeImg()">
  <button class="prev" onclick="prevImg(event)">❮</button>
  <img id="lightImg">
  <button class="next" onclick="nextImg(event)">❯</button>
</div>

<script>
// 图片数组：1.jpg ~100.jpg
const images = [];
for(let i=1;i<=100;i++){
  images.push(`${i}.jpg`);
}
let currentIndex = 0;
const lb = document.getElementById("lightbox");
const lbImg = document.getElementById("lightImg");

// 打开图片
function openImg(idx){
  currentIndex = idx;
  lbImg.src = images[currentIndex];
  lb.classList.add("active");
}
// 关闭
function closeImg(){
  lb.classList.remove("active");
}
// 上一张
function prevImg(e){
  e.stopPropagation();
  currentIndex = (currentIndex -1 + images.length) % images.length;
  lbImg.src = images[currentIndex];
}
// 下一张
function nextImg(e){
  e.stopPropagation();
  currentIndex = (currentIndex +1) % images.length;
  lbImg.src = images[currentIndex];
}
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二班相册</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#ffffff;
  color:#111;
  font-family:Arial,"Microsoft YaHei",sans-serif;
}

.header{
  padding:16px 20px;
  border-bottom:1px solid #eee;
}
.header h1{
  font-size:22px;
  text-align:center;
}
.header p{
  text-align:center;
  color:#666;
  font-size:14px;
  margin-top:6px;
}

/* 3列，30排 */
.photo-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-auto-rows:1fr;
  gap:10px;
  padding:10px;
}

/* 每张图固定 3:4，填满格子 */
.photo-grid .item{
  position:relative;
  aspect-ratio:3/4;
  overflow:hidden;
  border-radius:8px;
  background:#f3f3f3;
}

.photo-grid .item img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  cursor:pointer;
}

/* 放大弹窗 */
#lightbox{
  position:fixed;
  top:0;left:0;
  width:100vw;height:100vh;
  background:rgba(0,0,0,0.9);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}
#lightbox.active{display:flex;}
#lightbox img{
  max-width:95vw;
  max-height:95vh;
}
.prev, .next{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  font-size:44px;
  color:#fff;
  background:rgba(255,255,255,0.15);
  border:none;
  width:50px;height:80px;
  cursor:pointer;
  border-radius:8px;
}
.prev{left:16px;}
.next{right:16px;}
</style>
</head>
<body>

<div class="header">
  <h1>二班相册</h1>
  <p>3列 × 30排 · 照片比例3:4 · 点击图片放大</p>
</div>

<div class="photo-grid">

  <div class="item"><img src="1.jpg" onclick="openImg(0)"></div>
  <div class="item"><img src="2.jpg" onclick="openImg(1)"></div>
  <div class="item"><img src="3.jpg" onclick="openImg(2)"></div>
  <div class="item"><img src="4.jpg" onclick="openImg(3)"></div>
  <div class="item"><img src="5.jpg" onclick="openImg(4)"></div>
  <div class="item"><img src="6.jpg" onclick="openImg(5)"></div>
</div>

<div id="lightbox" onclick="closeImg()">
  <button class="prev" onclick="prevImg(event)">❮</button>
  <img id="lightImg">
  <button class="next" onclick="nextImg(event)">❯</button>
</div>

<script>
const images = [];
for(let i=1;i<=90;i++){
  images.push(`${i}.jpg`);
}

let currentIndex = 0;
const lb = document.getElementById("lightbox");
const lbImg = document.getElementById("lightImg");

function openImg(idx){
  currentIndex = idx;
  lbImg.src = images[currentIndex];
  lb.classList.add("active");
}
function closeImg(){
  lb.classList.remove("active");
}
function prevImg(e){
  e.stopPropagation();
  currentIndex = (currentIndex -1 + images.length) % images.length;
  lbImg.src = images[currentIndex];
}
function nextImg(e){
  e.stopPropagation();
  currentIndex = (currentIndex +1) % images.length;
  lbImg.src = images[currentIndex];
}
</script>

</body>
</html>

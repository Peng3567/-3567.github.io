<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二班相册</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
.photo-grid{
  display:grid;
  grid-template-columns: repeat(5, 1fr);
  gap:10px;
  padding:20px;
}
.photo-grid img{
  width:100%;
  height:180px;
  object-fit:contain;
  border:1px solid #ccc;
  cursor:pointer;
}
#lightbox{
  position:fixed;
  top:0;left:0;
  width:100vw;height:100vh;
  background:rgba(0,0,0,0.9);
  display:none;
  align-items:center;
  justify-content:center;
}
#lightbox.active{display:flex;}
#lightbox img{max-width:90vw;max-height:90vh;}
</style>
</head>
<body>
<div class="photo-grid">
<img src="1.jpg" onclick="openImg(0)">
<img src="2.jpg" onclick="openImg(1)">
<img src="3.jpg" onclick="openImg(2)">
<img src="4.jpg" onclick="openImg(3)">
<img src="5.jpg" onclick="openImg(4)">
<img src="6.jpg" onclick="openImg(5)">
</div>

<div id="lightbox" onclick="closeImg()">
  <img id="bigImg">
</div>

<script>
const imgs = ["1.jpg","2.jpg","3.jpg","4.jpg","5.jpg","6.jpg"];
let idx=0;
const lb=document.getElementById("lightbox");
const bigImg=document.getElementById("bigImg");
function openImg(i){
  idx=i;
  bigImg.src=imgs[idx];
  lb.classList.add("active");
}
function closeImg(){
  lb.classList.remove("active");
}
</script>
</body>
</html>

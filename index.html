<!DOCTYPE html>
 <html lang="zh-CN">
 <head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     我的相册
     <style>
         *{margin:0;padding:0;box-sizing:border-box;}
         body{
             background: #f8f8f8;
             font-family: "微软雅黑",sans-serif;
             padding:30px 10px;
         }
         .title{
             text-align:center;
             font-size:32px;
             color:#333;
             margin-bottom:40px;
             letter-spacing:2px;
         }
         .box{
             max-width:1000px;
             margin:0 auto;
             display: grid;
             grid-template-columns: 1fr 1fr 1fr;
             gap:20px;
         }
         .box img{
             width:100%;
             height:220px;
             object-fit:cover;
             border-radius:12px;
             transition:0.3s;
             box-shadow:0 2px 8px #00000018;
         }
         .box img:hover{
             transform:scale(1.05);
             box-shadow:0 8px 20px #00000028;
         }
         @media (max-width:768px){
             .box{grid-template-columns:1fr 1fr;}
         }
         @media (max-width:480px){
             .box{grid-template-columns:1fr;}
         }
     </style>
 </head>
 <body>
     <h1 class="title">我的专属相册</h1>
     <div class="box">
         <!-- ==========这里放你的照片========== -->
         <img src="1.jpg">
         <img src="2.jpg">
         <img src="3.jpg">
         <img src="4.jpg">
         <img src="5.jpg">
         <img src="6.jpg">
     </div>
 </body>
 </html>
